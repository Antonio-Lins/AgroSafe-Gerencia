<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroSafe Gerência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EA; --surface:#FBFCF7; --ink:#15231A; --muted:#5B6B5F; --line:#D8DFCD;
  --green:#2D5C3A; --green-d:#1B3A25; --leaf:#6E9B4F; --amber:#E2A12B; --amber-bg:#FAEBC4; --amber-ink:#6B4708;
  --red:#A93D2B; --red-bg:#F6DDD7; --ok-bg:#DDEBD2;
  --head:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:var(--head);letter-spacing:-.01em;line-height:1.1}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{border:0;border-radius:8px;padding:.65rem 1.1rem;font-weight:600;cursor:pointer;background:var(--green);color:#fff;transition:background .15s}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--ok-bg)}
.btn.danger{background:var(--red)}
.btn.sm{padding:.35rem .7rem;font-size:.85rem}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login-art{background:var(--green-d);color:#EAF1DF;padding:3rem;display:flex;flex-direction:column;justify-content:space-between;gap:2rem}
.logo{font-family:var(--head);font-weight:800;font-size:1.35rem;display:flex;align-items:center;gap:.6rem}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--leaf);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px}
.logo i b{background:var(--green-d);border-radius:2px}.logo i b:nth-child(2){background:var(--amber)}
.login-art h1{font-size:clamp(2rem,3.6vw,3.2rem);font-weight:800;max-width:15ch}
.login-art p{max-width:38ch;opacity:.8;margin-top:1rem}
.field-art{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:46px;gap:6px;max-width:460px}
.field-art span{border-radius:5px;background:#2F5E3B}
.field-art .a{background:#3D7345}.field-art .b{background:#548A4A}.field-art .c{background:#6E9B4F}
.field-art .q{background:var(--amber);animation:pulse 2.4s ease-in-out 1s 2}
@keyframes pulse{50%{opacity:.45}}
.login-form{display:grid;place-items:center;padding:2rem}
.login-form form{width:100%;max-width:360px}
.login-form h2{font-size:1.9rem;font-weight:800;margin-bottom:.4rem}
.sub{color:var(--muted);margin-bottom:1.6rem}
label{display:block;font-weight:600;font-size:.9rem;margin:1rem 0 .3rem}
input{width:100%;padding:.65rem .8rem;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus{border-color:var(--green)}
input.bad{border-color:var(--red)}
.err{color:var(--red);font-size:.85rem;margin-top:.3rem;min-height:1em}
.form-err{background:var(--red-bg);color:var(--red);padding:.6rem .8rem;border-radius:8px;margin-top:1rem;font-size:.9rem}
.login-form .btn{width:100%;margin-top:1.4rem}
.demo{margin-top:1.8rem;border-top:1px solid var(--line);padding-top:1rem;font-size:.85rem;color:var(--muted)}
.demo button{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;margin-top:.5rem;cursor:pointer}
.demo button:hover{background:var(--ok-bg)}
.demo b{color:var(--ink)}

/* shell */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--green-d);color:#EAF1DF;padding:1.5rem 1rem;display:flex;flex-direction:column;gap:2rem;position:sticky;top:0;height:100vh}
nav{display:flex;flex-direction:column;gap:.25rem}
nav a{color:#CFDCC2;text-decoration:none;padding:.6rem .8rem;border-radius:8px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.07)}
nav a.on{background:var(--green);color:#fff}
.me{margin-top:auto;font-size:.85rem}
.me strong{display:block}
.me .role{display:inline-block;margin:.2rem 0 .8rem;padding:.1rem .5rem;border-radius:99px;background:rgba(255,255,255,.12);font-size:.75rem}
.me .btn{background:rgba(255,255,255,.1);width:100%}
main{padding:2.2rem clamp(1rem,3vw,3rem);max-width:1100px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.head h2{font-size:2rem;font-weight:800}
.head p{color:var(--muted);margin-top:.3rem}
.ro{background:var(--amber-bg);color:var(--amber-ink);padding:.6rem .9rem;border-radius:8px;font-size:.9rem;margin-bottom:1.2rem}

/* parcels */
.map{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.6rem;padding:1rem;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tile{height:92px;border-radius:6px;padding:.55rem .7rem;color:#fff;background:var(--green);display:flex;flex-direction:column;justify-content:space-between;min-width:96px}
.tile.q{background:var(--amber);color:var(--amber-ink)}
.tile b{font-family:var(--head);font-size:1.05rem}
.tile small{opacity:.85}
.legend{display:flex;gap:1rem;font-size:.85rem;color:var(--muted);width:100%;margin-top:.4rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--green);margin-right:.35rem}
.legend i.q{background:var(--amber)}

/* table */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.82rem;color:var(--muted);font-weight:600;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
td{padding:.85rem 1rem;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.act{text-align:right;white-space:nowrap}
td.act .btn+.btn{margin-left:.35rem}
.badge{display:inline-block;padding:.12rem .6rem;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--ok-bg);color:var(--green-d)}
.badge.q{background:var(--amber-bg);color:var(--amber-ink)}
.until{display:block;font-size:.78rem;color:var(--muted);margin-top:.15rem}
.empty{padding:2.5rem;text-align:center;color:var(--muted)}

/* modal + toast */
dialog{border:0;border-radius:14px;padding:1.6rem;width:min(440px,92vw);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(21,35,26,.5)}
dialog h3{font-size:1.4rem;margin-bottom:.2rem}
.row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.4rem}
#toast{position:fixed;bottom:1.2rem;right:1.2rem;display:grid;gap:.5rem;z-index:99}
.t{background:var(--green-d);color:#fff;padding:.7rem 1rem;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:340px;animation:in .2s}
.t.e{background:var(--red)}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.reset{margin-top:2rem;font-size:.8rem;color:var(--muted)}
.reset button{background:none;border:0;text-decoration:underline;cursor:pointer;color:inherit}

@media(max-width:820px){
  .login{grid-template-columns:1fr}.login-art{padding:1.5rem}.field-art{display:none}
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;gap:.8rem;padding:.8rem 1rem}
  nav{flex-direction:row}.me{margin:0 0 0 auto;display:flex;align-items:center;gap:.6rem}.me .role,.me strong{display:none}.me .btn{width:auto;margin:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2,'0');
const isoDia = (add=0) => { const d=new Date(); d.setDate(d.getDate()+add); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; };
const br = iso => iso.split('-').reverse().join('/');
const fmtHa = n => Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});

/* ---------- "backend" simulado (localStorage) ---------- */
// Usuários iguais aos do DataInitializer do projeto
const USERS = [
  {id:1, nome:'Gestor AgroSafe',   email:'gestor@agrosafe.com',   senha:'Gestor@123',   perfil:'GESTOR'},
  {id:2, nome:'Operador AgroSafe', email:'operador@agrosafe.com', senha:'Operador@123', perfil:'OPERADOR'}
];
const seed = () => ({
  seq:{talhoes:7, defensivos:6},
  talhoes:[
    {id:1,codigo:'T-01',hectares:42.5,cultura:'Soja',dataLiberacao:null,temAplicacoes:true},
    {id:2,codigo:'T-02',hectares:38,cultura:'Milho',dataLiberacao:isoDia(9),temAplicacoes:true},
    {id:3,codigo:'T-03',hectares:27.8,cultura:'Café',dataLiberacao:null,temAplicacoes:false},
    {id:4,codigo:'T-04',hectares:55,cultura:'Soja',dataLiberacao:isoDia(3),temAplicacoes:true},
    {id:5,codigo:'T-05',hectares:61.2,cultura:'Algodão',dataLiberacao:isoDia(-12),temAplicacoes:true},
    {id:6,codigo:'T-06',hectares:18.4,cultura:'Feijão',dataLiberacao:null,temAplicacoes:false}
  ],
  defensivos:[
    {id:1,nomeComercial:'Decis 25 EC',principioAtivo:'Deltametrina',diasCarencia:14,temAplicacoes:true},
    {id:2,nomeComercial:'Engeo Pleno S',principioAtivo:'Tiametoxam + Lambda-cialotrina',diasCarencia:30,temAplicacoes:true},
    {id:3,nomeComercial:'Karate Zeon',principioAtivo:'Lambda-cialotrina',diasCarencia:21,temAplicacoes:false},
    {id:4,nomeComercial:'Priori Xtra',principioAtivo:'Azoxistrobina + Ciproconazol',diasCarencia:30,temAplicacoes:false},
    {id:5,nomeComercial:'Roundup Original',principioAtivo:'Glifosato',diasCarencia:7,temAplicacoes:false}
  ]
});
let db;
const load = () => { try { db = JSON.parse(localStorage.getItem('agrosafe_demo')) } catch(e){} db = db || seed(); };
const save = () => { try { localStorage.setItem('agrosafe_demo', JSON.stringify(db)) } catch(e){} };
const getUser = () => { try { return JSON.parse(sessionStorage.getItem('agrosafe_user')) } catch(e){ return null } };
const setUser = u => { try { u ? sessionStorage.setItem('agrosafe_user', JSON.stringify(u)) : sessionStorage.removeItem('agrosafe_user') } catch(e){} };
const estado = t => (t.dataLiberacao && t.dataLiberacao > isoDia(0)) ? 'EM_QUARENTENA' : 'LIVRE';

/* ---------- telas ---------- */
let rota = 'talhoes';

function toast(msg, erro){
  const el = document.createElement('div');
  el.className = 't' + (erro ? ' e' : ''); el.textContent = msg;
  $('#toast').append(el); setTimeout(() => el.remove(), 3500);
}

function renderLogin(){
  const art = ['','a','','b','c','a', 'b','','a','q','','c', 'a','c','','a','b','', '','b','a','','c','a']
    .map(c => `<span class="${c}"></span>`).join('');
  $('#app').innerHTML = `
  <div class="login">
    <section class="login-art">
      <div class="logo"><i><b></b><b></b><b></b><b></b></i>AgroSafe</div>
      <div>
        <h1>Cada talhão com a data certa de colheita.</h1>
        <p>Cadastre talhões e defensivos e saiba quais áreas estão livres ou em quarentena.</p>
      </div>
      <div class="field-art" aria-hidden="true">${art}</div>
    </section>
    <section class="login-form">
      <form id="f" novalidate>
        <h2>Entrar</h2>
        <p class="sub">Use o e-mail e a senha da sua conta.</p>
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username">
        <div class="err" id="e1"></div>
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password">
        <div class="err" id="e2"></div>
        <div id="fe"></div>
        <button class="btn" type="submit">Entrar</button>
        <div class="demo">Contas de demonstração
          <button type="button" data-u="0"><b>Gestor</b> · cadastra e edita</button>
          <button type="button" data-u="1"><b>Operador</b> · só consulta</button>
        </div>
      </form>
    </section>
  </div>`;
  document.querySelectorAll('.demo button').forEach(b => b.onclick = () => {
    const u = USERS[b.dataset.u]; $('#email').value = u.email; $('#senha').value = u.senha;
  });
  $('#f').onsubmit = e => {
    e.preventDefault();
    const email = $('#email').value.trim(), senha = $('#senha').value;
    $('#e1').textContent = email ? '' : 'O e-mail é obrigatório';
    $('#e2').textContent = senha ? '' : 'A senha é obrigatória';
    $('#fe').innerHTML = '';
    if(!email || !senha) return;
    const u = USERS.find(x => x.email.toLowerCase() === email.toLowerCase() && x.senha === senha);
    if(!u){ $('#fe').innerHTML = '<div class="form-err" role="alert">E-mail ou senha inválidos.</div>'; return; }
    setUser({id:u.id, nome:u.nome, email:u.email, perfil:u.perfil});
    rota = 'talhoes'; render();
  };
}

function shell(user, titulo, sub, acao, corpo){
  const gestor = user.perfil === 'GESTOR';
  $('#app').innerHTML = `
  <div class="shell">
    <aside>
      <div class="logo"><i><b></b><b></b><b></b><b></b></i>AgroSafe</div>
      <nav>
        <a href="#talhoes" class="${rota==='talhoes'?'on':''}">Talhões</a>
        <a href="#defensivos" class="${rota==='defensivos'?'on':''}">Defensivos</a>
      </nav>
      <div class="me">
        <strong>${esc(user.nome)}</strong>
        <span class="role">${gestor ? 'Gestor' : 'Operador'}</span>
        <button class="btn sm" id="sair">Sair</button>
      </div>
    </aside>
    <main>
      <div class="head">
        <div><h2>${titulo}</h2><p>${sub}</p></div>
        ${gestor ? acao : ''}
      </div>
      ${gestor ? '' : '<div class="ro">Você está como Operador: pode consultar, mas só o Gestor cadastra e edita.</div>'}
      ${corpo}
      <p class="reset"><button id="reset">Restaurar dados de demonstração</button></p>
    </main>
  </div>`;
  $('#sair').onclick = () => { setUser(null); render(); };
  $('#reset').onclick = () => { db = seed(); save(); toast('Dados de demonstração restaurados.'); render(); };
}

function viewTalhoes(user){
  const gestor = user.perfil === 'GESTOR';
  const lista = [...db.talhoes].sort((a,b) => a.codigo.localeCompare(b.codigo));
  const q = lista.filter(t => estado(t) === 'EM_QUARENTENA').length;
  const ha = lista.reduce((s,t) => s + t.hectares, 0);
  const tiles = lista.map(t => {
    const w = Math.max(96, Math.round(t.hectares * 3.4));
    return `<div class="tile ${estado(t)==='EM_QUARENTENA'?'q':''}" style="width:${w}px"><b>${esc(t.codigo)}</b><small>${esc(t.cultura)} · ${fmtHa(t.hectares)} ha</small></div>`;
  }).join('');
  const linhas = lista.map(t => {
    const em = estado(t) === 'EM_QUARENTENA';
    return `<tr>
      <td><strong>${esc(t.codigo)}</strong></td><td>${esc(t.cultura)}</td>
      <td class="num">${fmtHa(t.hectares)}</td>
      <td><span class="badge ${em?'q':''}">${em?'Em quarentena':'Livre'}</span>${em?`<span class="until">libera em ${br(t.dataLiberacao)}</span>`:''}</td>
      ${gestor ? `<td class="act"><button class="btn ghost sm" data-ed="${t.id}">Editar</button><button class="btn ghost sm" data-rm="${t.id}">Excluir</button></td>` : ''}
    </tr>`;
  }).join('');
  shell(user, 'Talhões', `${lista.length} talhões · ${fmtHa(ha)} ha no total · ${q} em quarentena`,
    '<button class="btn" id="novo">Novo talhão</button>',
    `<div class="map">${tiles}<div class="legend"><span><i></i>Livre</span><span><i class="q"></i>Em quarentena</span><span>O tamanho de cada bloco acompanha os hectares</span></div></div>
     <div class="card">${lista.length ? `<table><thead><tr><th>Código</th><th>Cultura</th><th class="num">Hectares</th><th>Estado</th>${gestor?'<th></th>':''}</tr></thead><tbody>${linhas}</tbody></table>` : '<div class="empty">Nenhum talhão cadastrado. Clique em “Novo talhão” para começar.</div>'}</div>`);
  ligar('talhoes');
}

function viewDefensivos(user){
  const gestor = user.perfil === 'GESTOR';
  const lista = [...db.defensivos].sort((a,b) => a.nomeComercial.localeCompare(b.nomeComercial));
  const linhas = lista.map(d => `<tr>
      <td><strong>${esc(d.nomeComercial)}</strong></td><td>${esc(d.principioAtivo)}</td>
      <td class="num">${d.diasCarencia} dias</td>
      ${gestor ? `<td class="act"><button class="btn ghost sm" data-ed="${d.id}">Editar</button><button class="btn ghost sm" data-rm="${d.id}">Excluir</button></td>` : ''}
    </tr>`).join('');
  shell(user, 'Defensivos', 'A carência é o mínimo de dias entre a aplicação e a colheita.',
    '<button class="btn" id="novo">Novo defensivo</button>',
    `<div class="card">${lista.length ? `<table><thead><tr><th>Nome comercial</th><th>Princípio ativo</th><th class="num">Carência</th>${gestor?'<th></th>':''}</tr></thead><tbody>${linhas}</tbody></table>` : '<div class="empty">Nenhum defensivo cadastrado. Clique em “Novo defensivo” para começar.</div>'}</div>`);
  ligar('defensivos');
}

/* ---------- formulários (mesmas regras dos DTOs do backend) ---------- */
const CFG = {
  talhoes:{ singular:'talhão', campos:[
    {k:'codigo', l:'Código', msg:'O código é obrigatório'},
    {k:'hectares', l:'Hectares', num:true, step:'0.01', msg:'Os hectares são obrigatórios', pos:'Os hectares devem ser maiores que zero'},
    {k:'cultura', l:'Cultura', msg:'A cultura é obrigatória'}]},
  defensivos:{ singular:'defensivo', campos:[
    {k:'nomeComercial', l:'Nome comercial', msg:'O nome comercial é obrigatório'},
    {k:'principioAtivo', l:'Princípio ativo', msg:'O princípio ativo é obrigatório'},
    {k:'diasCarencia', l:'Carência (dias)', num:true, step:'1', msg:'A carência é obrigatória', pos:'A carência deve ser um inteiro maior que zero', int:true}]}
};

function ligar(tipo){
  $('#novo') && ($('#novo').onclick = () => abrirForm(tipo));
  document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => abrirForm(tipo, db[tipo].find(x => x.id == b.dataset.ed)));
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => confirmarExcluir(tipo, db[tipo].find(x => x.id == b.dataset.rm)));
}

function abrirForm(tipo, item){
  const c = CFG[tipo], dlg = $('#dlg');
  dlg.innerHTML = `<form id="m" novalidate>
    <h3>${item ? 'Editar' : 'Novo'} ${c.singular}</h3>
    ${c.campos.map(f => `<label for="f_${f.k}">${f.l}</label>
      <input id="f_${f.k}" ${f.num?`type="number" step="${f.step}"`:'type="text"'} value="${item ? esc(item[f.k]) : ''}">
      <div class="err" id="err_${f.k}"></div>`).join('')}
    <div id="me"></div>
    <div class="row"><button type="button" class="btn ghost" id="cancela">Cancelar</button><button class="btn" type="submit">Salvar</button></div>
  </form>`;
  dlg.showModal(); dlg.querySelector('input').focus();
  $('#cancela').onclick = () => dlg.close();
  $('#m').onsubmit = e => {
    e.preventDefault();
    let ok = true; const v = {};
    c.campos.forEach(f => {
      const raw = $('#f_'+f.k).value.trim(); let msg = '';
      if(!raw) msg = f.msg;
      else if(f.num){ const n = Number(raw);
        if(!(n > 0) || (f.int && !Number.isInteger(n))) msg = f.pos; else v[f.k] = n;
      } else v[f.k] = raw;
      $('#err_'+f.k).textContent = msg; $('#f_'+f.k).classList.toggle('bad', !!msg);
      if(msg) ok = false;
    });
    if(!ok) return;
    if(tipo === 'talhoes' && db.talhoes.some(t => t.codigo === v.codigo && (!item || t.id !== item.id))){
      $('#me').innerHTML = `<div class="form-err" role="alert">O código "${esc(v.codigo)}" já está em uso.</div>`; return;
    }
    if(item) Object.assign(item, v);
    else db[tipo].push({id: db.seq[tipo]++, ...v, dataLiberacao:null, temAplicacoes:false});
    save(); dlg.close(); toast(`${c.singular[0].toUpperCase()+c.singular.slice(1)} salvo.`); render();
  };
}

function confirmarExcluir(tipo, item){
  const nome = item.codigo || item.nomeComercial, c = CFG[tipo], dlg = $('#dlg');
  dlg.innerHTML = `<h3>Excluir ${c.singular}?</h3>
    <p class="sub" style="margin-top:.6rem">“${esc(nome)}” será removido da lista.</p>
    <div class="row"><button class="btn ghost" id="cancela">Cancelar</button><button class="btn danger" id="ok">Excluir</button></div>`;
  dlg.showModal();
  $('#cancela').onclick = () => dlg.close();
  $('#ok').onclick = () => {
    dlg.close();
    if(item.temAplicacoes){ // regra de negócio do backend: preserva o histórico
      toast(`Não é possível excluir ${tipo==='talhoes'?'o talhão':'o defensivo'} "${nome}": há aplicações registradas e o histórico deve ser preservado.`, true); return;
    }
    db[tipo] = db[tipo].filter(x => x.id !== item.id); save(); toast(`${c.singular[0].toUpperCase()+c.singular.slice(1)} excluído.`); render();
  };
}

/* ---------- roteamento ---------- */
function render(){
  const user = getUser();
  if(!user) return renderLogin();
  rota = location.hash === '#defensivos' ? 'defensivos' : 'talhoes';
  rota === 'talhoes' ? viewTalhoes(user) : viewDefensivos(user);
}
window.addEventListener('hashchange', render);
load(); render();
</script>
</body>
</html>
